<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animoji Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #dbeafe 0%, #dbeafe 30%, #ffffff 30%, #ffffff 100%);
            overscroll-behavior: none;
        }
        .canvas-container {
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);
            background-color: #fdf2cb;
        }
        .bubbly-text {
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
        }
        .squircle {
            border-radius: 24px;
        }
        .hide {
            display: none !important;
        }
        .pill-left {
            position: absolute;
            left: -20px;
            top: 150px;
            width: 60px;
            height: 120px;
            background-color: #a7f3d0;
            border-radius: 60px;
            z-index: -1;
        }
        .pill-right {
            position: absolute;
            right: -20px;
            top: 100px;
            width: 80px;
            height: 160px;
            background-color: #fed7aa;
            border-radius: 60px;
            z-index: -1;
        }
        .guide-dot {
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            border: 2px solid white;
        }
        .faux-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            max-width: none !important;
            aspect-ratio: auto !important;
            border-radius: 0 !important;
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
            z-index: 9999 !important;
            background-color: #fdf2cb !important;
        }
    </style>
</head>
<body class="min-h-[100dvh] w-screen overflow-x-hidden flex flex-col items-center pt-8 relative pb-10">

    <div class="pill-left"></div>
    <div class="pill-right"></div>
    
    <div class="text-center mb-4 z-10">
        <h1 class="text-4xl font-semibold text-rose-400 bubbly-text leading-none">Animoji</h1>
        <h1 class="text-4xl font-semibold text-emerald-400 bubbly-text leading-none">Creator</h1>
        <div class="mt-3 inline-flex items-center gap-2 px-4 py-1.5 bg-white/90 rounded-full shadow-sm text-sm font-medium text-slate-600">
            <div id="status-indicator" class="w-2 h-2 rounded-full bg-gray-400"></div>
            <span id="status-text">Booting Up...</span>
        </div>
    </div>

    <div class="relative w-[90vw] max-w-md aspect-square canvas-container squircle border-4 border-white mb-6 p-2 z-10 flex items-center justify-center overflow-hidden">
        <canvas id="render-canvas" class="w-full h-full rounded-2xl"></canvas>
        
        <video id="webcam" class="hide" autoplay playsinline></video>
        
        <div id="pip-container" class="absolute bottom-4 right-4 w-28 h-36 bg-black rounded-2xl overflow-hidden shadow-xl border-2 border-white/50 transition-opacity duration-300 opacity-0 pointer-events-none">
            <video id="pip-video" class="w-full h-full object-cover transform -scale-x-100" autoplay playsinline></video>
            <canvas id="pip-canvas" class="absolute top-0 left-0 w-full h-full object-cover transform -scale-x-100"></canvas>
        </div>

        <button id="btn-camera" class="absolute inset-0 m-auto w-24 h-24 bg-emerald-400 rounded-full shadow-[0_10px_30px_rgba(52,211,153,0.5)] border-4 border-white flex items-center justify-center transition transform hover:scale-105 active:scale-95 disabled:opacity-50 z-20">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664-.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="absolute -bottom-8 text-sm font-bold text-emerald-600 bg-white px-4 py-1.5 rounded-full shadow-md whitespace-nowrap">Go Live!</span>
        </button>

        <div id="recording-timer" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-rose-500 text-white text-sm font-bold px-3 py-1 rounded-full shadow-lg z-30 hidden animate-pulse border-2 border-white">00:15</div>
        <button id="btn-record" class="absolute top-4 right-4 w-12 h-12 bg-white/80 backdrop-blur-sm rounded-full shadow-lg border-2 border-white flex items-center justify-center transition transform active:scale-95 z-30 hidden hover:bg-white">
            <div id="record-icon" class="w-4 h-4 bg-rose-500 rounded-full transition-all duration-300"></div>
        </button>

        <button id="btn-fullscreen" class="absolute top-4 left-4 w-12 h-12 bg-white/80 backdrop-blur-sm rounded-full shadow-lg border-2 border-white flex items-center justify-center transition transform active:scale-95 z-30 hover:bg-white text-slate-600">
            <svg id="fullscreen-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </button>
    </div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] p-6 z-20 flex flex-col gap-6 mt-4 shrink-0">
        <div>
            <h3 class="text-xs font-bold text-slate-400 tracking-wider mb-3">CHARACTER STUDIO</h3>
            <div class="grid grid-cols-4 gap-2">
                <button id="btn-bear" class="bg-blue-100 text-blue-600 rounded-2xl p-2.5 flex flex-col items-center border-2 border-blue-200 shadow-sm transition active:scale-95">
                    <span class="text-xl mb-1">🐻</span>
                    <span class="text-[10px] font-bold">BEAR</span>
                </button>
                <button id="btn-cat" class="bg-slate-100 text-slate-500 rounded-2xl p-2.5 flex flex-col items-center border-2 border-transparent transition active:scale-95">
                    <span class="text-xl mb-1">🐱</span>
                    <span class="text-[10px] font-bold">CAT</span>
                </button>
                <button id="btn-moose" class="bg-slate-100 text-slate-500 rounded-2xl p-2.5 flex flex-col items-center border-2 border-transparent transition active:scale-95">
                    <span class="text-xl mb-1">🫎</span>
                    <span class="text-[10px] font-bold">MOOSE</span>
                </button>
                <button id="btn-dog" class="bg-slate-100 text-slate-500 rounded-2xl p-2.5 flex flex-col items-center border-2 border-transparent transition active:scale-95">
                    <span class="text-xl mb-1">🐶</span>
                    <span class="text-[10px] font-bold">DOG</span>
                </button>
                <button id="btn-bird" class="bg-slate-100 text-slate-500 rounded-2xl p-2.5 flex flex-col items-center border-2 border-transparent transition active:scale-95">
                    <span class="text-xl mb-1">🐦</span>
                    <span class="text-[10px] font-bold">BIRD</span>
                </button>
                <button id="btn-penguin" class="bg-slate-100 text-slate-500 rounded-2xl p-2.5 flex flex-col items-center border-2 border-transparent transition active:scale-95">
                    <span class="text-xl mb-1">🐧</span>
                    <span class="text-[10px] font-bold">PENGUIN</span>
                </button>
                <button id="btn-custom-trigger" class="col-span-2 bg-indigo-50 text-indigo-500 rounded-2xl p-2.5 flex items-center justify-center gap-2 border-2 border-dashed border-indigo-200 transition active:scale-95 hover:bg-indigo-100">
                    <span class="text-xl">🖼</span>
                    <span class="text-xs font-bold tracking-wide">ADD CUSTOM</span>
                </button>
            </div>
        </div>

        <div>
            <h3 class="text-xs font-bold text-slate-400 tracking-wider mb-3">COLOR VARIANT</h3>
            <select id="select-variant" class="w-full bg-slate-50 border border-slate-200 text-slate-600 font-bold rounded-xl p-3 outline-none focus:ring-2 focus:ring-emerald-400 cursor-pointer shadow-sm transition">
                <option value="0">Variant 1</option>
                <option value="1">Variant 2</option>
                <option value="2">Variant 3</option>
                <option value="3">Variant 4</option>
            </select>
        </div>

        <div>
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-slate-400 tracking-wider">ADJUSTMENTS</h3>
                <button id="btn-toggle-pip" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg transition active:scale-95 shadow-sm border border-slate-200">Show Live Feed</button>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-4">
                <div class="flex items-center gap-4">
                    <span class="text-xs font-bold text-slate-500 w-12">EYES</span>
                    <input type="range" id="slider-eyes" min="0.1" max="2.0" step="0.05" value="1.0" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-400">
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xs font-bold text-slate-500 w-12">NOSE</span>
                    <input type="range" id="slider-nose" min="0.1" max="2.0" step="0.05" value="1.0" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-400">
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xs font-bold text-slate-500 w-12">MOUTH</span>
                    <input type="range" id="slider-mouth" min="0.1" max="2.0" step="0.05" value="1.0" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-400">
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Character Modal -->
    <div id="modal-custom" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-sm flex flex-col overflow-hidden shadow-2xl transform transition-all max-h-[95dvh]">
            <div class="bg-indigo-50 p-3 border-b border-indigo-100 text-center shrink-0">
                <h2 class="text-lg font-bold text-indigo-900">Custom Character</h2>
            </div>
            
            <div class="p-4 flex flex-col gap-4 overflow-y-auto">
                <div class="relative w-full aspect-square bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjZjFmNWY5Ii8+PHJlY3QgeD0iMTAiIHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCIgZmlsbD0iI2UydThmMCIvPjxyZWN0IHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiNlMmV4ZjAiLz48cmVjdCB4PSIxMCIgeT0iMTAiIHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCIgZmlsbD0iI2YxZjVmOSIvPjwvc3ZnPg==')] rounded-2xl overflow-hidden border border-slate-200 shadow-inner shrink-0" id="custom-preview-container">
                    <canvas id="custom-preview-canvas" class="w-full h-full absolute inset-0"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <p id="custom-status" class="text-sm font-bold text-slate-500 text-center px-4 bg-white/80 p-2 rounded-xl">Upload a photo to begin.</p>
                    </div>
                    
                    <!-- Draggable Interactive Guide Dots -->
                    <div id="guide-e1" class="guide-dot w-6 h-6 bg-blue-400 rounded-full hidden cursor-grab active:cursor-grabbing touch-none z-10 hover:scale-110 transition-transform"></div>
                    <div id="guide-e2" class="guide-dot w-6 h-6 bg-blue-400 rounded-full hidden cursor-grab active:cursor-grabbing touch-none z-10 hover:scale-110 transition-transform"></div>
                    <div id="guide-mouth" class="guide-dot w-8 h-8 bg-rose-400 rounded-full hidden cursor-grab active:cursor-grabbing touch-none z-10 hover:scale-110 transition-transform"></div>

                    <!-- Magnifying Glass Lens Overlay -->
                    <div id="magnifier" class="absolute w-24 h-24 rounded-full border-4 border-white shadow-2xl overflow-hidden hidden pointer-events-none z-30 bg-slate-900">
                        <canvas id="magnifier-canvas" class="absolute inset-0 w-full h-full"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <div class="w-1.5 h-1.5 bg-rose-500 rounded-full border border-white"></div>
                        </div>
                    </div>
                </div>

                <div class="shrink-0">
                    <input type="file" id="custom-file" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>

                <div id="custom-controls" class="hidden flex-col gap-3 shrink-0 pb-2">
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-600" title="Lock the background in place">
                            <input type="checkbox" id="c-static" class="accent-emerald-400 w-4 h-4">
                            STATIC MODE
                        </label>
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-600" id="label-use-mask">
                            <input type="checkbox" id="c-use-mask" class="accent-indigo-400 w-4 h-4" checked>
                            MASK FACE
                        </label>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-2" id="panel-mask">
                        <div class="flex items-center gap-2"><span class="text-[10px] font-bold text-slate-400 w-12">EXPAND</span><input type="range" id="c-expand" min="1.0" max="2.0" step="0.05" value="1.2" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none accent-indigo-500"></div>
                        <div class="flex items-center gap-2"><span class="text-[10px] font-bold text-slate-400 w-12">FEATHER</span><input type="range" id="c-feather" min="0" max="40" step="1" value="15" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none accent-indigo-500"></div>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-2 hidden" id="panel-scale">
                        <div class="flex items-center gap-2"><span class="text-[10px] font-bold text-slate-400 w-12">SCALE</span><input type="range" id="c-scale" min="0.5" max="3.0" step="0.05" value="1.0" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none accent-amber-500"></div>
                        <div class="flex items-center gap-2"><span class="text-[10px] font-bold text-slate-400 w-12">PAN X</span><input type="range" id="c-pan-x" min="-0.5" max="0.5" step="0.01" value="0" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none accent-amber-500"></div>
                        <div class="flex items-center gap-2"><span class="text-[10px] font-bold text-slate-400 w-12">PAN Y</span><input type="range" id="c-pan-y" min="-0.5" max="0.5" step="0.01" value="0" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none accent-amber-500"></div>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-400 mb-2">FEATURE PLACEMENT (Or drag dots above)</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <span class="text-[9px] font-bold text-blue-400">LEFT EYE (X/Y)</span>
                                <input type="range" id="c-e1x" min="0" max="1" step="0.005" value="0.35" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-blue-400">
                                <input type="range" id="c-e1y" min="0" max="1" step="0.005" value="0.4" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-blue-400">
                            </div>
                            <div class="space-y-1">
                                <span class="text-[9px] font-bold text-blue-400">RIGHT EYE (X/Y)</span>
                                <input type="range" id="c-e2x" min="0" max="1" step="0.005" value="0.65" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-blue-400">
                                <input type="range" id="c-e2y" min="0" max="1" step="0.005" value="0.4" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-blue-400">
                            </div>
                            <div class="space-y-1 col-span-2">
                                <span class="text-[9px] font-bold text-rose-400">MOUTH (X/Y)</span>
                                <div class="flex gap-2">
                                    <input type="range" id="c-mx" min="0" max="1" step="0.005" value="0.5" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-rose-400">
                                    <input type="range" id="c-my" min="0" max="1" step="0.005" value="0.7" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none accent-rose-400">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 shrink-0 pt-2 border-t border-slate-100">
                    <button id="btn-custom-cancel" class="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-500 active:scale-95 transition">Cancel</button>
                    <button id="btn-custom-save" class="flex-1 py-3 bg-emerald-500 rounded-xl font-bold text-white active:scale-95 transition opacity-50 pointer-events-none">Save & Use</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">

        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const btnCamera = document.getElementById('btn-camera');
        const pipContainer = document.getElementById('pip-container');
        const canvas = document.getElementById('render-canvas');

                { base: '#ef4444', headLight: '#fca5a5', bodyTop: '#dc2626', bodyBottom: '#991b1b', snout: '#f59e0b', extra: '#f87171' }, 
                { base: '#eab308', headLight: '#fef08a', bodyTop: '#ca8a04', bodyBottom: '#a16207', snout: '#f97316', extra: '#fde047' }, 
                { base: '#334155', headLight: '#475569', bodyTop: '#1e293b', bodyBottom: '#0f172a', snout: '#475569', extra: '#64748b' }  
            ],
            penguin: [
                { base: '#0f172a', headLight: '#1e293b', bodyTop: '#0f172a', bodyBottom: '#020617', snout: '#f59e0b', extra: '#f8fafc' }, 
                { base: '#334155', headLight: '#475569', bodyTop: '#334155', bodyBottom: '#1e293b', snout: '#f97316', extra: '#fef08a' }, 
                { base: '#1e3a8a', headLight: '#1d4ed8', bodyTop: '#1e3a8a', bodyBottom: '#172554', snout: '#64748b', extra: '#e2e8f0' }, 
                { base: '#78350f', headLight: '#92400e', bodyTop: '#78350f', bodyBottom: '#451a03', snout: '#1c1917', extra: '#d6d3d1' }  
            ],
            custom: [ { base: '#ffffff', snout: '#ffffff', extra: '#ffffff' } ]
        };

        const MOUTH_CONTOUR = [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185];
        const LEFT_EYE_CONTOUR = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
        const RIGHT_EYE_CONTOUR = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398];
        const FACE_OVAL_CONTOUR = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
        const UPPER_LIP_TOP_INDEX = 13;

        function setStatus(text, colorClass) {
            statusText.textContent = text;
            statusIndicator.className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        async function initializeEngine() {
            try {
                btnCamera.disabled = true;
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "CPU" },
                    outputFaceBlendshapes: true,
                    runningMode: "VIDEO",
                    numFaces: 1
                });

                imageLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "CPU" },
                    runningMode: "IMAGE",
                    numFaces: 1,
                    minFaceDetectionConfidence: 0.1, 
                    minFacePresenceConfidence: 0.1
                });

                setStatus("Ready to animate", "bg-blue-400");
                btnCamera.disabled = false;
            } catch (error) {
                setStatus("Engine Error", "bg-red-500");
                console.error("MediaPipe initialization failed:", error);
            }
        }

        function resizeCanvases() {
            if (canvas.offsetWidth === 0) return;
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            canvas.width = canvas.offsetWidth * dpr;
            canvas.height = canvas.offsetHeight * dpr;
            
            if (isCameraActive && video.videoWidth > 0) {
                pipCanvas.width = video.videoWidth;
                pipCanvas.height = video.videoHeight;
            }
            drawScene();
        }
        window.addEventListener('resize', resizeCanvases);

        btnCamera.addEventListener('click', async () => {
            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
                        audio: true
                    });
                } catch (e) {
                    console.warn("Microphone access denied. Falling back to video only.", e);
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
                    });
                }
                
                audioStream = stream;
                video.srcObject = stream;
                pipVideo.srcObject = stream;
                video.muted = true; 
                pipVideo.muted = true;
                await video.play();
                await pipVideo.play();
                
                video.onloadedmetadata = () => {
                    isCameraActive = true;
                    btnCamera.classList.add('opacity-0', 'pointer-events-none');
                    if (showPip) pipContainer.classList.remove('opacity-0', 'pointer-events-none');
                    document.getElementById('btn-record').classList.remove('hidden'); 
                    resizeCanvases();
                    setStatus("Live! Make a face!", "bg-emerald-400");
                    requestAnimationFrame(renderLoop);
                };
            } catch (error) {
                setStatus("Camera Denied", "bg-red-500");
                console.error(error);
            }
        });

        async function renderLoop() {
            if (isCameraActive && video.videoWidth > 0 && !video.paused) {
                try {
                    let startTimeMs = performance.now();
                    if (lastVideoTime !== video.currentTime) {
                        lastVideoTime = video.currentTime;
                        trackingResults = faceLandmarker.detectForVideo(video, startTimeMs);
                    }
                    drawScene();
                } catch(e) {
                    console.warn("Frame processing skipped:", e);
                }
            }
            requestAnimationFrame(renderLoop); 
        }

        function drawScene() {
            if (canvas.width === 0 || (isCameraActive && video.videoWidth === 0)) return;
            
            ctx.fillStyle = '#fdf2cb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            const screenCenterX = canvas.width / 2;
            const screenCenterY = canvas.height / 2;
            
            const headRadius = Math.min(canvas.width, canvas.height) * 0.35;
            
            let landmarks = null;
            let angle = 0; 
            let yawX = 0;
            let pitchY = 0;
            let globalScale = 1.0;
            
            const vw = video.videoWidth || 640;
            const vh = video.videoHeight || 480;
            
            const isCustomStatic = (selectedCharacter === 'custom' && customSettings.isStatic);

            if (trackingResults && trackingResults.faceLandmarks && trackingResults.faceLandmarks.length > 0) {
                landmarks = trackingResults.faceLandmarks[0];
                const nose = landmarks[1];
                const leftCorner = landmarks[33];   
                const rightCorner = landmarks[263]; 
                
                cx = (1.0 - nose.x) * canvas.width;
                cy = nose.y * canvas.height;
                
                const dxRoll = ((1.0 - leftCorner.x) - (1.0 - rightCorner.x)) * vw;
                const dyRoll = (leftCorner.y - rightCorner.y) * vh;
                angle = Math.atan2(dyRoll, dxRoll);
                
                const faceWidthRatio = Math.sqrt(dxRoll * dxRoll + dyRoll * dyRoll) / vw;
                
                if (faceWidthRatio > 0.05) {
                    globalScale = (headRadius * 1.5) / (faceWidthRatio * vw);
                    const uX = dxRoll / (faceWidthRatio * vw);
                    const uY = dyRoll / (faceWidthRatio * vw);
                    const vX = -uY;
                    const vY = uX;
                    const midEyeX = ((1.0 - leftCorner.x) + (1.0 - rightCorner.x)) / 2;
                    const midEyeY = (leftCorner.y + rightCorner.y) / 2;
                    const nX = (1.0 - nose.x) - midEyeX;
                    const nY = nose.y - midEyeY;
                    
                    const localYaw = (nX * uX + nY * uY) / faceWidthRatio; 
                    const rawPitch = (nX * vX + nY * vY) / faceWidthRatio;
                    let localPitch = rawPitch - 0.30; 
                    
                    yawX = localYaw * headRadius * 1.2;
                    pitchY = localPitch * headRadius * 1.2;
                }
                drawPIPVisualizer(landmarks);
            } else {
                drawPIPVisualizer(null); 
            }

            let customBgDrawW = headRadius * 2.4;
            let customBgDrawH = customBgDrawW;
            let customStaticScaleMult = 1.0;

            if (selectedCharacter === 'custom' && customImageMasked) {
                if (isCustomStatic) {
                    const coverScale = Math.max(canvas.width / customImageMasked.width, canvas.height / customImageMasked.height);
                    customBgDrawW = customImageMasked.width * coverScale;
                    customBgDrawH = customImageMasked.height * coverScale;
                    customStaticScaleMult = customBgDrawW / (headRadius * 2.4);
                }
            }

            const surfaceX = isCustomStatic ? screenCenterX : cx + yawX;
            const surfaceY = isCustomStatic ? screenCenterY : cy + pitchY;
            const snoutX = cx + yawX * 1.2;
            const snoutY = (cy + pitchY * 1.2) + (headRadius * 0.05);

            // 1. Draw Base Head & Body
            ctx.save();
            ctx.translate(isCustomStatic ? screenCenterX : cx, isCustomStatic ? screenCenterY : cy);
            ctx.rotate(isCustomStatic ? 0 : angle);
            ctx.translate(isCustomStatic ? -screenCenterX : -cx, isCustomStatic ? -screenCenterY : -cy);
            
            if (selectedCharacter === 'bear') drawBearBase(cx, cy, headRadius, yawX, pitchY);
            else if (selectedCharacter === 'moose') drawMooseBase(cx, cy, headRadius, yawX, pitchY);
            else if (selectedCharacter === 'dog') drawDogBase(cx, cy, headRadius, yawX, pitchY);
            else if (selectedCharacter === 'bird') drawBirdBase(cx, cy, headRadius, yawX, pitchY);
            else if (selectedCharacter === 'penguin') drawPenguinBase(cx, cy, headRadius, yawX, pitchY);
            else if (selectedCharacter === 'cat') drawCatBase(cx, cy, headRadius, yawX, pitchY);
            else if (selectedCharacter === 'custom' && customImageMasked) {
                if (isCustomStatic) {
                    ctx.drawImage(customImageMasked, screenCenterX - customBgDrawW/2, screenCenterY - customBgDrawH/2, customBgDrawW, customBgDrawH);
                } else {
                    const hx = cx + yawX * 0.2;
                    const hy = cy + pitchY * 0.2;
                    ctx.drawImage(customImageMasked, hx - customBgDrawW/2, hy - customBgDrawH/2, customBgDrawW, customBgDrawH);
                }
            }
            ctx.restore();

            let rEyeTargetX, rEyeTargetY, lEyeTargetX, lEyeTargetY, mTargetX, mTargetY;
            
            if (selectedCharacter === 'custom' && customImageMasked) {
                const e1x = customSettings.e1x; const e1y = customSettings.e1y;
                const e2x = customSettings.e2x; const e2y = customSettings.e2y;
                const mx = customSettings.mx;   const my = customSettings.my;

                if (isCustomStatic) {
                    const imgLeft = screenCenterX - customBgDrawW/2;
                    const imgTop = screenCenterY - customBgDrawH/2;
                    
                    rEyeTargetX = imgLeft + e1x * customBgDrawW;
                    rEyeTargetY = imgTop + e1y * customBgDrawH;
                    lEyeTargetX = imgLeft + e2x * customBgDrawW;
                    lEyeTargetY = imgTop + e2y * customBgDrawH;
                    mTargetX = imgLeft + mx * customBgDrawW;
                    mTargetY = imgTop + my * customBgDrawH;
                } else {
                    const hx = cx + yawX * 0.2;
                    const hy = cy + pitchY * 0.2;
                    const rawPitchY = pitchY + (0.30 * headRadius * 1.2);
                    const parallaxX = yawX * 0.4;
                    const parallaxY = rawPitchY * 0.4;
                    
                    const pImgLeft = hx - customBgDrawW/2;
                    const pImgTop = hy - customBgDrawH/2;

                    rEyeTargetX = pImgLeft + parallaxX + e1x * customBgDrawW;
                    rEyeTargetY = pImgTop + parallaxY + e1y * customBgDrawH;
                    lEyeTargetX = pImgLeft + parallaxX + e2x * customBgDrawW;
                    lEyeTargetY = pImgTop + parallaxY + e2y * customBgDrawH;
                    mTargetX = pImgLeft + parallaxX + mx * customBgDrawW;
                    mTargetY = pImgTop + parallaxY + my * customBgDrawH;
                }
            } else {
                rEyeTargetX = surfaceX - headRadius * 0.35;
                rEyeTargetY = surfaceY - headRadius * 0.2;
                lEyeTargetX = surfaceX + headRadius * 0.35;
                lEyeTargetY = surfaceY - headRadius * 0.2;
                mTargetX = snoutX;
                mTargetY = snoutY + headRadius * 0.40;
            }

            const getRotatedPos = (targetX, targetY, isMouth = false) => {
                let posAngle = angle;
                if (isCustomStatic) {
                    posAngle = isMouth ? angle : (angle * 0.1);
                }
                const pivotX = isCustomStatic ? screenCenterX : cx;
                const pivotY = isCustomStatic ? screenCenterY : cy;
                
                const dx = targetX - pivotX;
                const dy = targetY - pivotY;
                
                return {
                    x: pivotX + dx * Math.cos(posAngle) - dy * Math.sin(posAngle),
                    y: pivotY + dx * Math.sin(posAngle) + dy * Math.cos(posAngle)
                };
            };

            const rEyePos = getRotatedPos(rEyeTargetX, rEyeTargetY, false);
            const lEyePos = getRotatedPos(lEyeTargetX, lEyeTargetY, false);
            const mouthPos = getRotatedPos(mTargetX, mTargetY, true); 

            // 2. Draw Snout Background
            if (selectedCharacter !== 'custom') {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.translate(-cx, -cy);
                
                ctx.fillStyle = PALETTES[selectedCharacter][selectedVariant].snout;
                if (selectedCharacter === 'moose' || selectedCharacter === 'dog') {
                    ctx.beginPath(); ctx.ellipse(snoutX, snoutY, headRadius * 0.45 * noseScale, headRadius * 0.35 * noseScale, 0, 0, Math.PI * 2); ctx.fill();
                } else if (selectedCharacter === 'bird' || selectedCharacter === 'penguin') {
                    ctx.beginPath();
                    ctx.moveTo(snoutX - headRadius * 0.3 * noseScale, snoutY - headRadius * 0.1 * noseScale);
                    ctx.quadraticCurveTo(snoutX, snoutY + headRadius * 0.5 * noseScale, snoutX + headRadius * 0.3 * noseScale, snoutY - headRadius * 0.1 * noseScale);
                    ctx.quadraticCurveTo(snoutX, snoutY - headRadius * 0.2 * noseScale, snoutX - headRadius * 0.3 * noseScale, snoutY - headRadius * 0.1 * noseScale);
                    ctx.fill();
                } else {
                    ctx.beginPath(); ctx.arc(snoutX, snoutY, headRadius * 0.4 * noseScale, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            // 3. Draw Cutouts
            const eyeDrawAngle = isCustomStatic ? angle * 0.1 : angle; 
            const mouthDrawAngle = angle; 

            const finalEyeScale = globalScale * eyeScale * (isCustomStatic ? customStaticScaleMult : 1.0);
            const finalMouthScale = globalScale * mouthScale * (isCustomStatic ? customStaticScaleMult : 1.0);

            if (landmarks && globalScale > 0 && globalScale !== Infinity) {
                const skinColor = selectedCharacter === 'custom' ? '#ffffff' : PALETTES[selectedCharacter][selectedVariant].base;
                const topLipPt = landmarks[UPPER_LIP_TOP_INDEX];
                
                drawAlignedCutout(landmarks, RIGHT_EYE_CONTOUR, rEyePos.x, rEyePos.y, finalEyeScale, eyeDrawAngle, skinColor, null, 0.4);
                drawAlignedCutout(landmarks, LEFT_EYE_CONTOUR, lEyePos.x, lEyePos.y, finalEyeScale, eyeDrawAngle, skinColor, null, 0.4);
                drawAlignedCutout(landmarks, MOUTH_CONTOUR, mouthPos.x, mouthPos.y, finalMouthScale, mouthDrawAngle, skinColor, topLipPt, 1.0);
            } else {
                const currentEyeRad = headRadius * 0.2 * eyeScale * (isCustomStatic ? customStaticScaleMult : 1.0);
                const currentPupilRad = headRadius * 0.08 * eyeScale * (isCustomStatic ? customStaticScaleMult : 1.0);
                const currentMouthWidth = headRadius * 0.2 * mouthScale * (isCustomStatic ? customStaticScaleMult : 1.0);

                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(rEyePos.x, rEyePos.y, currentEyeRad, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(lEyePos.x, lEyePos.y, currentEyeRad, 0, Math.PI*2); ctx.fill();
                
                const pupilXOffset = isCustomStatic ? 0 : yawX * 0.15;
                const pupilYOffset = isCustomStatic ? 0 : pitchY * 0.15;
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(rEyePos.x + pupilXOffset, rEyePos.y + pupilYOffset, currentPupilRad, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(lEyePos.x + pupilXOffset, lEyePos.y + pupilYOffset, currentPupilRad, 0, Math.PI*2); ctx.fill();
                
                ctx.save();
                ctx.translate(mouthPos.x, mouthPos.y);
                ctx.rotate(mouthDrawAngle);
                ctx.beginPath(); ctx.moveTo(-currentMouthWidth, 0); ctx.lineTo(currentMouthWidth, 0);
                ctx.lineWidth = 4; ctx.stroke();
                ctx.restore();
            }

            // 4. Draw Black Nose
            if (selectedCharacter !== 'custom' && selectedCharacter !== 'bird' && selectedCharacter !== 'penguin') {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.translate(-cx, -cy);
                ctx.fillStyle = '#000';
                if (selectedCharacter === 'cat') {
                    ctx.beginPath(); ctx.moveTo(snoutX, snoutY - headRadius * 0.05 * noseScale); ctx.lineTo(snoutX - headRadius * 0.1 * noseScale, snoutY + headRadius * 0.05 * noseScale); ctx.lineTo(snoutX + headRadius * 0.1 * noseScale, snoutY + headRadius * 0.05 * noseScale); ctx.closePath(); ctx.fill();
                } else if (selectedCharacter === 'dog') {
                    ctx.beginPath(); ctx.roundRect(snoutX - headRadius * 0.15 * noseScale, snoutY - headRadius * 0.1 * noseScale, headRadius * 0.3 * noseScale, headRadius * 0.2 * noseScale, 8); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.arc(snoutX, snoutY, headRadius * 0.15 * noseScale, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }

        function drawAlignedCutout(landmarks, indices, targetX, targetY, scale, rollAngle, skinColor, anchorPt = null, featherScale = 1.0) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            let minX = 1, maxX = 0, minY = 1, maxY = 0;
            indices.forEach(idx => {
                const pt = landmarks[idx];
                if(pt.x < minX) minX = pt.x;
                if(pt.x > maxX) maxX = pt.x;
                if(pt.y < minY) minY = pt.y;
                if(pt.y > maxY) maxY = pt.y;
            });
            let anchorX = (minX + maxX) / 2;
            let anchorY = (minY + maxY) / 2;
            if (anchorPt) { anchorX = anchorPt.x; anchorY = anchorPt.y; }
            
            ctx.save();
            ctx.translate(targetX, targetY);
            ctx.rotate(rollAngle);
            ctx.beginPath();
            indices.forEach((idx, i) => {
                const pt = landmarks[idx];
                const dx = ((1.0 - pt.x) - (1.0 - anchorX)) * vw * scale;
                const dy = (pt.y - anchorY) * vh * scale;
                if (i === 0) ctx.moveTo(dx, dy); else ctx.lineTo(dx, dy);
            });
            ctx.closePath();
            ctx.clip();
            ctx.scale(-1, 1);
            const drawW = vw * scale;
            const drawH = vh * scale;
            ctx.drawImage(video, -anchorX * drawW, -anchorY * drawH, drawW, drawH);
            ctx.scale(-1, 1);
            
            if (selectedCharacter !== 'custom') {
                ctx.lineWidth = 15 * featherScale;
                ctx.strokeStyle = skinColor;
                ctx.shadowColor = skinColor;
                ctx.shadowBlur = 10 * featherScale;
                ctx.stroke();
                ctx.lineWidth = 8 * featherScale;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPIPVisualizer(landmarks) {
            pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
            if(!landmarks) return;
            const drawContour = (indices, color) => {
                pipCtx.beginPath();
                indices.forEach((idx, i) => {
                    const pt = landmarks[idx];
                    const x = pt.x * pipCanvas.width;
                    const y = pt.y * pipCanvas.height;
                    if (i === 0) pipCtx.moveTo(x, y); else pipCtx.lineTo(x, y);
                });
                pipCtx.closePath();
                pipCtx.strokeStyle = color;
                pipCtx.lineWidth = 2;
                pipCtx.setLineDash([5, 5]);
                pipCtx.stroke();
                pipCtx.setLineDash([]);
            };
            drawContour(LEFT_EYE_CONTOUR, '#06b6d4');
            drawContour(RIGHT_EYE_CONTOUR, '#06b6d4');
            drawContour(MOUTH_CONTOUR, '#ec4899');
        }

        function drawBearBase(cx, cy, r, yaw, pitch) {
            const colors = PALETTES['bear'][selectedVariant];
            const hx = cx + yaw * 0.2; const hy = cy + pitch * 0.2;
            const ex = cx - yaw * 0.3; const ey = cy - pitch * 0.3;
            const px = cx + yaw * 0.1; const py = cy + pitch * 0.1;
            const gradT = ctx.createRadialGradient(hx, hy+r*1.5, 0, hx, hy+r*1.5, r);
            gradT.addColorStop(0, colors.bodyTop); gradT.addColorStop(1, colors.bodyBottom);
            ctx.fillStyle = gradT; ctx.beginPath(); ctx.roundRect(hx - r*0.8, hy + r*0.5, r*1.6, r, r*0.5); ctx.fill();
            ctx.fillStyle = colors.base;
            ctx.beginPath(); ctx.arc(ex - r*0.7, ey - r*0.7, r*0.3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(ex + r*0.7, ey - r*0.7, r*0.3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = colors.extra;
            ctx.beginPath(); ctx.arc(ex - r*0.7, ey - r*0.7, r*0.15, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(ex + r*0.7, ey - r*0.7, r*0.15, 0, Math.PI*2); ctx.fill();
            const grad = ctx.createRadialGradient(hx, hy-r*0.2, 0, hx, hy, r);
            grad.addColorStop(0, colors.headLight); grad.addColorStop(1, colors.base);
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = colors.bodyBottom;
            ctx.beginPath(); ctx.arc(px - r*0.6, py + r*1.2, r*0.25, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px + r*0.6, py + r*1.2, r*0.25, 0, Math.PI*2); ctx.fill();
        }

        function drawCatBase(cx, cy, r, yaw, pitch) {
            const colors = PALETTES['cat'][selectedVariant];
            const hx = cx + yaw * 0.2; const hy = cy + pitch * 0.2;
            const ex = cx - yaw * 0.3; const ey = cy - pitch * 0.3;
            const px = cx + yaw * 0.1; const py = cy + pitch * 0.1;
            const gradT = ctx.createRadialGradient(hx, hy+r*1.5, 0, hx, hy+r*1.5, r);
            gradT.addColorStop(0, colors.bodyTop); gradT.addColorStop(1, colors.bodyBottom);
            ctx.fillStyle = gradT; ctx.beginPath(); ctx.roundRect(hx - r*0.7, hy + r*0.5, r*1.4, r, r*0.5); ctx.fill();
            ctx.fillStyle = colors.base;
            ctx.beginPath(); ctx.moveTo(ex - r*0.8, ey - r); ctx.lineTo(ex - r*0.3, ey - r*0.6); ctx.lineTo(ex - r*0.9, ey - r*0.2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(ex + r*0.8, ey - r); ctx.lineTo(ex + r*0.3, ey - r*0.6); ctx.lineTo(ex + r*0.9, ey - r*0.2); ctx.fill();
            const grad = ctx.createRadialGradient(hx, hy-r*0.2, 0, hx, hy, r);
            grad.addColorStop(0, colors.headLight); grad.addColorStop(1, colors.base);
            ctx.fillStyle = grad; ctx.beginPath(); ctx.ellipse(hx, hy, r*1.1, r*0.9, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = colors.extra;
            ctx.beginPath(); ctx.arc(px - r*0.5, py + r*1.2, r*0.2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px + r*0.5, py + r*1.2, r*0.2, 0, Math.PI*2); ctx.fill();
        }

        function drawMooseBase(cx, cy, r, yaw, pitch) {
            const colors = PALETTES['moose'][selectedVariant];
            const hx = cx + yaw * 0.2; const hy = cy + pitch * 0.2;
            const ex = cx - yaw * 0.3; const ey = cy - pitch * 0.3;
            const px = cx + yaw * 0.1; const py = cy + pitch * 0.1;
            const gradT = ctx.createRadialGradient(hx, hy+r*1.5, 0, hx, hy+r*1.5, r);
            gradT.addColorStop(0, colors.bodyTop); gradT.addColorStop(1, colors.bodyBottom);

                            const ratio = Math.min(MAX_SIZE / sw, MAX_SIZE / sh);

                            sh = Math.round(sh * ratio);

        function generateCustomImage(autoAlign = false) {
            if (!customBaseImage) return;

            const size = 512;
            const outCanvas = document.createElement('canvas');
            outCanvas.width = size;
            outCanvas.height = size;
            const ctxC = outCanvas.getContext('2d');

            const useMask = cUseMask.checked;
            const sw = customBaseImage.width;
            const sh = customBaseImage.height;

            let transform = { offsetX: 0, offsetY: 0, scale: 1 };

            if (useMask && customFaceLandmarks) {
                const expand = parseFloat(cExpand.value);
                const feather = parseFloat(cFeather.value);
                
                let minX = 1, maxX = 0, minY = 1, maxY = 0;
                FACE_OVAL_CONTOUR.forEach(idx => {
                    const pt = customFaceLandmarks[idx];
                    if(pt.x < minX) minX = pt.x;
                    if(pt.x > maxX) maxX = pt.x;
                    if(pt.y < minY) minY = pt.y;
                    if(pt.y > maxY) maxY = pt.y;
                });
                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;

                const expandedW = (maxX - minX) * sw * expand;
                const expandedH = (maxY - minY) * sh * expand;
                const pad = feather * 2;
                const neededSize = Math.max(expandedW, expandedH) + pad * 2;
                
                const faceScale = size / neededSize;
                transform.scale = faceScale;
                transform.offsetX = size/2 - (cx * sw * transform.scale);
                transform.offsetY = size/2 - (cy * sh * transform.scale);

                ctxC.fillStyle = '#ffffff';
                if (feather > 0) ctxC.filter = `blur(${feather}px)`;
                ctxC.beginPath();
                FACE_OVAL_CONTOUR.forEach((idx, i) => {
                    const pt = customFaceLandmarks[idx];
                    const nx = cx + (pt.x - cx) * expand;
                    const ny = cy + (pt.y - cy) * expand;
                    const canvasX = transform.offsetX + (nx * sw * transform.scale);
                    const canvasY = transform.offsetY + (ny * sh * transform.scale);
                    if (i === 0) ctxC.moveTo(canvasX, canvasY);
                    else ctxC.lineTo(canvasX, canvasY);
                });
                ctxC.closePath();
                ctxC.fill();
                
                ctxC.filter = 'none';
                ctxC.globalCompositeOperation = 'source-in';
            } else {
                const scale = parseFloat(cScale.value);
                const panX = parseFloat(cPanX.value) * size;
                const panY = parseFloat(cPanY.value) * size;

                const baseScale = size / Math.max(sw, sh);
                transform.scale = baseScale * scale;
                transform.offsetX = (size/2 + panX) - (sw/2 * transform.scale);
                transform.offsetY = (size/2 + panY) - (sh/2 * transform.scale);
            }

            ctxC.translate(transform.offsetX, transform.offsetY);
            ctxC.scale(transform.scale, transform.scale);
            ctxC.drawImage(customBaseImage, 0, 0);

            if (autoAlign && customFaceLandmarks) {
                const ptEye1 = customFaceLandmarks[33]; 
                const ptEye2 = customFaceLandmarks[263];
                const ptMouth = customFaceLandmarks[13];

                const getNorm = (pt) => {
                    const finalX = transform.offsetX + (pt.x * sw * transform.scale);
                    const finalY = transform.offsetY + (pt.y * sh * transform.scale);
                    return { x: finalX / size, y: finalY / size };
                };

                const e1 = getNorm(ptEye1);
                const e2 = getNorm(ptEye2);
                const m = getNorm(ptMouth);

                cE1X.value = e1.x; cE1Y.value = e1.y;
                cE2X.value = e2.x; cE2Y.value = e2.y;
                cMX.value = m.x; cMY.value = m.y;
            }

            const img = new Image();
            img.onload = () => {
                customImageMasked = img;
                updateCustomPreview();
            };
            img.src = outCanvas.toDataURL('image/png');
        }

        function updateCustomPreview() {
            if(!customImageMasked) return;
            const cvs = customPreviewCanvas;
            const ctxC = cvs.getContext('2d');
            const w = cvs.width = cvs.offsetWidth;
            const h = cvs.height = cvs.offsetHeight;
            
            ctxC.clearRect(0,0,w,h);
            ctxC.drawImage(customImageMasked, 0, 0, w, h);

            const e1x = parseFloat(cE1X.value); const e1y = parseFloat(cE1Y.value);
            const e2x = parseFloat(cE2X.value); const e2y = parseFloat(cE2Y.value);
            const mx = parseFloat(cMX.value); const my = parseFloat(cMY.value);
            
            document.getElementById('guide-e1').style.left = `${e1x * 100}%`;

            document.getElementById('guide-mouth').style.left = `${mx * 100}%`;
            document.getElementById('guide-mouth').style.top = `${my * 100}%`;
        }

        // --- Drag & Drop Features with Magnifier ---
        let draggedGuide = null;
        const dotMapping = {
            'guide-e1': { x: cE1X, y: cE1Y },
            'guide-e2': { x: cE2X, y: cE2Y },
            'guide-mouth': { x: cMX, y: cMY }
        };
        const previewContainer = document.getElementById('custom-preview-container');

        function startDrag(e) {
            e.preventDefault();
            draggedGuide = e.target;
            magnifier.classList.remove('hidden');
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function drag(e) {
            if(!draggedGuide) return;
            e.preventDefault();
            const rect = previewContainer.getBoundingClientRect();
            
            let clientX, clientY;
            if(e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let normX = (clientX - rect.left) / rect.width;
            let normY = (clientY - rect.top) / rect.height;

            normX = Math.max(0, Math.min(1, normX));
            normY = Math.max(0, Math.min(1, normY));

            const mapped = dotMapping[draggedGuide.id];
            if(mapped) {
                mapped.x.value = normX;
                mapped.y.value = normY;
                updateCustomPreview();
                updateMagnifier(clientX, clientX, clientY, rect);
            }
        }

        function updateMagnifier(x, clientX, clientY, rect) {
            if(!customImageMasked) return;
            const mw = magnifierCanvas.width = 96;
            const mh = magnifierCanvas.height = 96;
            magnifierCtx.clearRect(0,0,mw,mh);
            
            magnifierCtx.save();
            magnifierCtx.imageSmoothingEnabled = false; // Pixelated zoom for accuracy
            
            const targetX = clientX - rect.left;
            const targetY = clientY - rect.top;
            
            const zoomFactor = 4.0;
            const srcSizeW = mw / zoomFactor;
            const srcSizeH = mh / zoomFactor;
            
            const srcX = targetX - (srcSizeW / 2);
            const srcY = targetY - (srcSizeH / 2);
            
            const scaleX = customPreviewCanvas.width / rect.width;
            const scaleY = customPreviewCanvas.height / rect.height;

            magnifierCtx.drawImage(
                customPreviewCanvas, 
                srcX * scaleX, srcY * scaleY, srcSizeW * scaleX, srcSizeH * scaleY,
                0, 0, mw, mh
            );
            
            magnifierCtx.restore();

            // Position magnifier near touch/cursor
            let magLeft = targetX + 20;
            let magTop = targetY - 110;
            if(magLeft + 96 > rect.width) magLeft = targetX - 116;
            if(magTop < 0) magTop = targetY + 20;

            magnifier.style.left = `${magLeft}px`;
            magnifier.style.top = `${magTop}px`;
        }

        function endDrag() {
            draggedGuide = null;
            magnifier.classList.add('hidden');
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchend', endDrag);
        }

        guides.forEach(g => {
            g.addEventListener('mousedown', startDrag);
            g.addEventListener('touchstart', startDrag, {passive: false});
        });

        btnCustomSave.addEventListener('click', () => {
            customSettings.e1x = parseFloat(cE1X.value);
            customSettings.e1y = parseFloat(cE1Y.value);
            customSettings.e2x = parseFloat(cE2X.value);
            customSettings.e2y = parseFloat(cE2Y.value);
            customSettings.mx = parseFloat(cMX.value);
            customSettings.my = parseFloat(cMY.value);
            customSettings.isStatic = cStatic.checked;
            
            modalCustom.classList.add('hidden');
            modalCustom.classList.remove('flex');
            updateCharacterSelection('custom');
        });

        const btnRecord = document.getElementById('btn-record');
        const recordIcon = document.getElementById('record-icon');
        const timerUI = document.getElementById('recording-timer');

        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                try {
                    const canvasStream = canvas.captureStream(30);
                    const audioTracks = audioStream ? audioStream.getAudioTracks() : [];
                    
                    let processedAudioStream = null;
                    if (audioTracks.length > 0) {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const dest = audioCtx.createMediaStreamDestination();
                        const source = audioCtx.createMediaStreamSource(audioStream);
                        source.connect(dest);
                        processedAudioStream = dest.stream;
                    }
                    
                    const combinedStream = new MediaStream([
                        ...canvasStream.getVideoTracks(),
                        ...(processedAudioStream ? processedAudioStream.getAudioTracks() : [])
                    ]);
                    
                    let options = {};
                    const targetBitrate = 5000000; 

                    if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2')) {
                        options = { mimeType: 'video/mp4;codecs=avc1,mp4a.40.2', videoBitsPerSecond: targetBitrate }; 
                    } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                        options = { mimeType: 'video/mp4', videoBitsPerSecond: targetBitrate }; 
                    } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264,opus')) {
                        options = { mimeType: 'video/webm;codecs=h264,opus', videoBitsPerSecond: targetBitrate }; 
                    } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
                        options = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: targetBitrate }; 
                    } else {
                        options = { mimeType: 'video/webm', videoBitsPerSecond: targetBitrate };
                    }
                                    
                    mediaRecorder = new MediaRecorder(combinedStream, options);
                    recordedChunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        clearInterval(recordingTimer);
                        timerUI.classList.add('hidden');

                        let finalMimeType = mediaRecorder.mimeType || options.mimeType || 'video/mp4';
                        const blob = new Blob(recordedChunks, { type: finalMimeType });
                        const url = URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        
                        const extension = finalMimeType.includes('mp4') ? 'mp4' : 'webm';
                        a.download = `animoji-${Date.now()}.${extension}`;
                        
                        document.body.appendChild(a);
                        a.click();
                        
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 1000);
                        
                        setStatus("Video Saved!", "bg-emerald-500");
                        setTimeout(() => { if(isCameraActive && !isRecording) setStatus("Live! Make a face!", "bg-emerald-400"); }, 3000);
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    
                    btnRecord.classList.add('animate-pulse', 'border-rose-300');
                    recordIcon.classList.remove('rounded-full');
                    recordIcon.classList.add('rounded-sm', 'scale-75');
                    
                    recordingSecondsLeft = 15;
                    timerUI.textContent = `00:${recordingSecondsLeft}`;
                    timerUI.classList.remove('hidden');
                    
                    if(audioTracks.length === 0) setStatus("Recording (No Mic)...", "bg-rose-500");
                    else setStatus("Recording...", "bg-rose-500");

                    recordingTimer = setInterval(() => {
                        recordingSecondsLeft--;
                        if(recordingSecondsLeft < 10) timerUI.textContent = `00:0${recordingSecondsLeft}`;
                        else timerUI.textContent = `00:${recordingSecondsLeft}`;
                        
                        if(recordingSecondsLeft <= 0) {
                            if (isRecording) stopRecording();
                        }
                    }, 1000);

                } catch (e) {
                    console.error("Recording failed:", e);
                    setStatus("Recording Error", "bg-red-500");
                }
            } else {
                stopRecording();
            }
        });

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(recordingTimer);
                timerUI.classList.add('hidden');
                
                btnRecord.classList.remove('animate-pulse', 'border-rose-300');
                recordIcon.classList.add('rounded-full');
                recordIcon.classList.remove('rounded-sm', 'scale-75');
                setStatus("Saving Video...", "bg-blue-400");
            }
        }

        const btnFullscreen = document.getElementById('btn-fullscreen');
        const fullscreenIcon = document.getElementById('fullscreen-icon');
        const canvasContainer = document.querySelector('.canvas-container');
        let isFauxFullscreen = false;

        btnFullscreen.addEventListener('click', () => {
            isFauxFullscreen = !isFauxFullscreen;
            
            if (isFauxFullscreen) {
                canvasContainer.classList.add('faux-fullscreen');
                fullscreenIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h6m0 0v6m0-6l-7 7m17-11h-6m0 0V4m0 6l7-7M4 10h6m0 0V4m0 6l-7-7m17 11h-6m0 0v6m0-6l7 7"></path>`;
            } else {
                canvasContainer.classList.remove('faux-fullscreen');
                fullscreenIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>`;
            }
            setTimeout(resizeCanvases, 50);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isCameraActive) {
                if (video.paused) video.play().catch(e => console.warn("Video resume failed:", e));
                if (pipVideo.paused) pipVideo.play().catch(e => console.warn("PIP resume failed:", e));
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvases();
            drawScene();
            initializeEngine();
        });
    </script>
</body>
</html>
